name: Build Windows Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ModernSignageUI

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ModernSignageUI

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-build
          path: |
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
